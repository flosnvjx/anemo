name: Anemo CI

on:
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'Android.bp'
      - '/metadata'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'Android.bp'
      - '/metadata'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Project checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'
      - name: Generate one-off dev signing key
        run: |
          STORE_PASS="$(openssl rand -hex 16)"
          KEY_PASS="$STORE_PASS"
          ALIAS="anemo-dev"
          KEYSTORE_PATH="$RUNNER_TEMP/anemo-signing.jks"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Anemo Dev, OU=Dev, O=Fork, L=Unknown, ST=Unknown, C=US"
          {
            echo "androidStorePassword=$STORE_PASS"
            echo "androidKeyAlias=$ALIAS"
            echo "androidKeyPassword=$KEY_PASS"
            echo "androidStoreFile=$KEYSTORE_PATH"
          } >> local.properties
      - name: Build
        id: build
        run: |
          echo 'org.gradle.caching=true' >> gradle.properties
          echo 'org.gradle.parallel=true' >> gradle.properties
          echo 'org.gradle.vfs.watch=true' >> gradle.properties
          echo 'org.gradle.jvmargs=-Xmx2048m' >> gradle.properties
          ./gradlew :app:assembleRelease
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: "app/build/outputs/apk/release/app-release.apk"
          retention-days: 14
          archive: false
